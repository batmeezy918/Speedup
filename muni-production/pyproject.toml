[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "muni-quotient"
version = "1.0.0"
description = "Certified exact quotient reduction for U = Ubar (x) I_m on block-constant states, with per-call verification."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []

[project.urls]
Homepage = "https://github.com/batmeezy918/Speedup"

[tool.setuptools]
packages = ["muni"]
package-dir = {"muni" = "muni"}

[tool.setuptools.package-data]
muni = ["kernel_agl.h"]
