name: Mathlib Lean4 Verification

on:
  push:
    paths:
      - 'lean4/Mathlib/**'
      - 'lean4/chronofold/**'
      - '.github/workflows/mathlib-lean4.yml'
  pull_request:
    paths:
      - 'lean4/Mathlib/**'
      - 'lean4/chronofold/**'
      - '.github/workflows/mathlib-lean4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mathlib:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lean4/Mathlib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan and repository-pinned Lean
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd lean4/Mathlib
          elan toolchain install "$(cat lean-toolchain)"
          elan default "$(cat lean-toolchain)"
          lean --version
          lake --version

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build declared Mathlib target
        run: lake build

      - name: Reject unfinished proofs
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.lean' -E '\b(sorry|admit|by\?)\b' .; then
            echo 'Unfinished proof marker detected.'
            exit 1
          fi

      - name: Verify every Mathlib source in this project
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            rel="${file#./}"
            echo "=== lake env lean $rel ==="
            lake env lean "$rel"
          done < <(find . -maxdepth 1 -type f -name '*.lean' -print0 | sort -z)
