name: Official COCO Registered Benchmark

on:
  workflow_dispatch:
    inputs:
      dimensions:
        description: BBOB dimension
        default: '10'
      budget:
        description: Function-evaluation budget
        default: '1000'
      seed:
        description: Deterministic seed
        default: '20260810'
  push:
    paths:
      - .github/workflows/official-coco-registered.yml
      - benchmarks/**

permissions:
  contents: read

jobs:
  official-coco:
    name: COCO/BBOB official harness
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COCO_DIMENSIONS: '10'
      COCO_BUDGET: '1000'
      COCO_SEED: '20260810'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout Speedup
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install registered COCO stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'coco-experiment==2.8.2' 'cma==4.4.4' 'numpy==2.2.6'
          python -c "import cocoex,cma,numpy; print(cocoex.__version__, cma.__version__, numpy.__version__)"

      - name: Verify official BBOB identity
        run: |
          python - <<'PY'
          import cocoex, hashlib, json
          suite = cocoex.Suite('bbob', '', 'dimensions: 10')
          first = suite.get_problem(0)
          rec = {'suite':'bbob','dimensions':10,'problem_count':len(suite),'first_problem_id':first.id,'f_zero':float(first([0.0]*10)),'coco_version':getattr(cocoex,'__version__','unknown')}
          print(json.dumps({**rec,'record_sha256':hashlib.sha256(json.dumps(rec,sort_keys=True).encode()).hexdigest()},indent=2))
          assert len(suite)==360
          PY

      - name: Execute elevated S6 official Observer harness
        run: |
          mkdir -p evidence/runtime/official-coco
          python benchmarks/s6_official_coco.py --dimensions $COCO_DIMENSIONS --budget $COCO_BUDGET --seed $COCO_SEED --output-dir evidence/runtime/official-coco

      - name: Upload immutable benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: official-coco-elevated-s6
          path: evidence/runtime/official-coco/
          if-no-files-found: error
          retention-days: 90
