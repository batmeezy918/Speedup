name: Lean4 Verification

on:
  push:
    paths:
      - 'lean4/**/*.lean'
      - 'lean4/**/lean-toolchain'
      - 'scripts/verify_lean4_all.sh'
      - '.github/workflows/chronofold-lean4.yml'
  pull_request:
    paths:
      - 'lean4/**/*.lean'
      - 'lean4/**/lean-toolchain'
      - 'scripts/verify_lean4_all.sh'
      - '.github/workflows/chronofold-lean4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lean4 through elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Verify Lean4 compiler from repository root
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          test -x "$HOME/.elan/bin/lean"

      - name: Verify every Lean4 source regardless of folder
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_lean4_all.sh lean4

      - name: Export Lean proof identities
        shell: bash
        run: |
          set -euo pipefail
          find lean4 -type f -name '*.lean' -print0 | sort -z | xargs -0 sha256sum | tee lean4-proof-identities.sha256
