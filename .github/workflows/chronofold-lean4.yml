name: ChronoFold Lean4 Verification

on:
  push:
    paths:
      - 'lean4/chronofold/**'
      - '.github/workflows/chronofold-lean4.yml'
  pull_request:
    paths:
      - 'lean4/chronofold/**'
      - '.github/workflows/chronofold-lean4.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan and Lean4
        uses: leanprover/elan-action@v1
        with:
          toolchain: leanprover/lean4:stable
          default-toolchain: true

      - name: Verify Lean version
        run: lean --version

      - name: Fetch Mathlib cache
        working-directory: lean4/chronofold
        run: lake exe cache get

      - name: Build ChronoFold proof
        working-directory: lean4/chronofold
        run: lake env lean ChronoFoldProof.lean

      - name: Reject unfinished proof markers
        run: |
          if grep -RInE '\b(sorry|admit|by\?)\b' lean4/chronofold --include='*.lean'; then
            echo 'Unfinished proof marker detected.'
            exit 1
          fi

      - name: Export proof identity
        run: |
          sha256sum lean4/chronofold/ChronoFoldProof.lean > ChronoFoldProof.lean.sha256
          cat ChronoFoldProof.lean.sha256
