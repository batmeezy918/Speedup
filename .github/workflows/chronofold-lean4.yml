name: Lean4 Verification

on:
  push:
    paths:
      - 'lean4/**/*.lean'
      - 'lean4/**/lean-toolchain'
      - '.github/workflows/chronofold-lean4.yml'
  pull_request:
    paths:
      - 'lean4/**/*.lean'
      - 'lean4/**/lean-toolchain'
      - '.github/workflows/chronofold-lean4.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lean4 through elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Verify Lean4 compiler from repository root
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          test -x "$HOME/.elan/bin/lean"

      - name: Verify every Lean4 source regardless of folder
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find lean4 -type f -name '*.lean' -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No Lean4 source files found.'
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "=== lean $file ==="
            lean "$file"
          done

      - name: Reject unfinished proof markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '\b(sorry|admit|by\?)\b' lean4 --include='*.lean'; then
            echo 'Unfinished proof marker detected.'
            exit 1
          fi

      - name: Export Lean proof identities
        shell: bash
        run: |
          set -euo pipefail
          find lean4 -type f -name '*.lean' -print0 | sort -z | xargs -0 sha256sum | tee lean4-proof-identities.sha256
