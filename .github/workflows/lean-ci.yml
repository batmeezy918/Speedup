name: Lean 4 Verification

on:
  push:
    paths:
      - 'lean4/**/*.lean'
      - 'lean4/**/lean-toolchain'
      - 'scripts/verify_lean4_all.sh'
      - '.github/workflows/lean-ci.yml'
  pull_request:
    paths:
      - 'lean4/**/*.lean'
      - 'lean4/**/lean-toolchain'
      - 'scripts/verify_lean4_all.sh'
      - '.github/workflows/lean-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install repository-declared Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if ! command -v elan >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain leanprover/lean4:stable
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test -f lean4/chronofold/lean-toolchain
          TOOLCHAIN="$(tr -d '\r\n' < lean4/chronofold/lean-toolchain)"
          test -n "$TOOLCHAIN"
          elan toolchain install "$TOOLCHAIN"
          elan default "$TOOLCHAIN"
          lean --version
          lake --version

      - name: Verify all Lean4 sources
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/verify_lean4_all.sh lean4

      - name: Run the ChronoFold proof workload explicitly
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          test -f lean4/chronofold/ChronoFoldProof.lean
          test -f lean4/chronofold/LinearQuotientProof.lean
          test -f lean4/chronofold/GODSQuotientClosure.lean
          test -f lean4/chronofold/ProgressTargetCoupling.lean
          if [[ -f lean4/chronofold/lakefile.lean ]]; then
            (cd lean4/chronofold && lake build)
          fi
          bash scripts/verify_lean4_all.sh lean4/chronofold core

      - name: Export Lean proof identities and verification manifest
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p verification-artifact
          {
            echo "toolchain=$(tr -d '\r\n' < lean4/chronofold/lean-toolchain)"
            echo "lean=$(lean --version)"
            echo "lake=$(lake --version)"
            echo "commit=${GITHUB_SHA}"
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "status=VERIFIED_WORKLOAD"
          } | tee verification-artifact/environment.txt
          find lean4 -type f -name '*.lean' -print0 | sort -z | xargs -0 sha256sum \
            | tee verification-artifact/lean-proof-identities.sha256
          {
            echo 'ChronoFoldProof.lean'
            echo 'LinearQuotientProof.lean'
            echo 'GODSQuotientClosure.lean'
            echo 'ProgressTargetCoupling.lean'
          } | tee verification-artifact/verified-workload.txt

      - name: Upload verified Lean workload artifact
        uses: actions/upload-artifact@v4
        with:
          name: speedup-lean4-verified-workload
          path: verification-artifact/
          if-no-files-found: error
          retention-days: 30
