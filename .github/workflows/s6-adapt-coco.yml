name: S6 Diagonal Adaptation COCO Pipeline

on:
  workflow_dispatch:
    inputs:
      dimensions:
        description: 'BBOB dimension'
        required: false
        default: '10'
      budget:
        description: 'Function-evaluation budget per problem'
        required: false
        default: '1000'
      seed:
        description: 'Deterministic seed'
        required: false
        default: '20260810'
  push:
    paths:
      - '.github/workflows/s6-adapt-coco.yml'
      - 'evidence/official-coco/s6_adapt.py'
      - 'evidence/official-coco/s6_adapt_runner.py'
      - 'evidence/official-coco/s6_adapt_safe_runner.py'

permissions:
  contents: read

jobs:
  s6-adapt:
    name: S6 Diagonal Adaptation & Safe-Runner Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      COCO_DIMENSIONS: ${{ github.event.inputs.dimensions || '10' }
      COCO_BUDGET: ${{ github.event.inputs.budget || '1000' }
      COCO_SEED: ${{ github.event.inputs.seed || '20260810' }
      PYTHONHASHSEED: '0'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install registered COCO stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'coco-experiment==2.8.2' 'numpy==2.2.6'
          python - <<'PY'
          import cocoex, numpy
          print('cocoex=', getattr(cocoex, '__version__', 'unknown'))
          print('numpy=', numpy.__version__)
          PY

      - name: Verify BBOB identity (360 problems, dim 10)
        run: |
          python - <<'PY'
          import cocoex, hashlib, json, os
          dim = int(os.environ['COCO_DIMENSIONS'])
          suite = cocoex.Suite('bbob', '', f'dimensions: {dim}')
          first = suite.get_problem(0)
          # Confirm Problem has .dimension; Observer must not be passed
          assert hasattr(first, 'dimension'), 'Problem missing .dimension'
          obs = cocoex.Observer('bbob', 'result_folder: IDENTITY_PROBE')
          assert not hasattr(obs, 'dimension'), 'Observer unexpectedly has .dimension'
          record = {
              'suite': 'bbob', 'dimensions': dim,
              'problem_count': len(suite),
              'first_problem_id': first.id,
              'coco_version': getattr(cocoex, '__version__', 'unknown'),
          }
          print(json.dumps(record, indent=2))
          if dim == 10 and len(suite) != 360:
              raise SystemExit(f'unexpected count: {len(suite)}')
          PY

      - name: Run S6 adaptation harness via safe runner
        working-directory: evidence/official-coco
        run: |
          RUN_DIR="../runtime/s6-adapt-${{ github.run_id }}"
          mkdir -p "${RUN_DIR}"
          python s6_adapt_runner.py \
            --dimensions "${COCO_DIMENSIONS}" \
            --budget "${COCO_BUDGET}" \
            --seed "${COCO_SEED}" \
            --observer-folder "S6_ADAPT_OBS" \
            --output-dir "${RUN_DIR}" 2>&1 | tee "${RUN_DIR}/stdout.log"

      - name: Hash runtime evidence
        run: |
          RUN_DIR="evidence/runtime/s6-adapt-${{ github.run_id }}"
          find "${RUN_DIR}" -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee "${RUN_DIR}/SHA256SUMS.txt"

      - name: Enforce gates
        run: |
          RUN_DIR="evidence/runtime/s6-adapt-${{ github.run_id }}"
          python - <<PY
          import json, sys
          paths = __import__('glob').glob(f"{RUN_DIR}/s6_adapt_summary.json")
          if not paths:
              print('No summary found'); sys.exit(1)
          with open(paths[0]) as f:
              m = json.load(f)
          print(json.dumps({k: v for k, v in m.items() if k != 'results'}, indent=2))
          if m.get('problem_count') != 360:
              print(f"INCOMPLETE: problem_count={m.get('problem_count')}"); sys.exit(1)
          if m.get('evidence_class') != 'FORMAL_PARTIAL':
              print(f"EVIDENCE_CLASS VIOLATION: {m.get('evidence_class')}"); sys.exit(1)
          print('GATES_PASS')
          PY

      - name: Upload immutable evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: s6-adapt-coco-${{ github.run_id }
          path: evidence/runtime/s6-adapt-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90

      - name: Publish summary
        if: always()
        run: |
          RUN_DIR="evidence/runtime/s6-adapt-${{ github.run_id }}"
          {
            echo '## S6 Diagonal Adaptation COCO Run'
            echo
            echo "- Commit: \`$GITUB_SHA\`"
            echo "- Dimension: \`$COCO_DIMENSIONS\`"
            echo "- Budget: \`$COCO_BUDGET\`"
            echo "- Seed: \`$COCO_SEED\`"
            echo '- Contract: suite.get_problem(i) -> run_s6_adapt(problem)'
            echo '- Observer: observe_with logging only'
            echo '- Evidence class: FORMAL_PARTIAL'
          } >> "$GITUB_STEP_SUMMARY"
