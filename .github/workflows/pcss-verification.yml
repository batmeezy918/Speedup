name: PCSS Verification Gate

on:
  push:
    branches: [ main, agd-gemm-lean-stack ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f CONSTITUTION.md
          test -f SPECIFICATIONS.md
          test -f publisher/gate.py
          test -f evidence/schema/certificate.schema.json
          test -f lean4/PCSSCertificate.lean
          test -f lean4/lakefile.lean
          test -f lean4/SpeedupLean.lean
          test -f lean4/AGDGemmWork.lean
          test -f lean4/AGDGemmProjection.lean
          test -f lean4/AGDGemmReconstruction.lean
          test -f lean4/AGDGemmSpeedup.lean

      - name: Validate Python gate syntax
        run: python3 -m py_compile publisher/gate.py scripts/evidence_to_lean.py

      - name: Validate certificate gate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pcss-certificate.json <<'JSON'
          {
            "run_id": "ci-structural-check",
            "scenario_hash": "ci",
            "source_hash": "ci",
            "gates": {
              "integrity": true,
              "reproducibility": true,
              "quotient_forward": true,
              "reconstruction_reverse": true,
              "invariants": true,
              "performance": true,
              "lean": false
            }
          }
          JSON
          if python3 publisher/gate.py /tmp/pcss-certificate.json; then
            echo "Gate unexpectedly passed with lean=false"
            exit 1
          else
            echo "Fail-closed certificate behavior confirmed"
          fi

      - name: Install Lean (elan)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build Lean 4 AGD-GEMM stack
        working-directory: lean4
        run: |
          set -euo pipefail
          lean --version
          lake --version
          lake build 2>&1 | tee /tmp/lake-build.log
          if grep -q "Build completed successfully (0 jobs)" /tmp/lake-build.log; then
            echo "Lake built 0 jobs — default_target is not wired."
            exit 1
          fi
          if grep -RIn --include='*.lean' -E '^[[:space:]]*(sorry|admit)([[:space:]]|$)' .; then
            echo PLACEHOLDER_FOUND
            exit 1
          fi
          if grep -RIn --include='*.lean' -E '^[[:space:]]*import Mathlib' .; then
            echo MATHLIB_IMPORT_FOUND
            exit 1
          fi
          echo NO_PLACEHOLDERS=1
          echo NO_MATHLIB=1
