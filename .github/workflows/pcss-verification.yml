name: PCSS Verification Gate

on:
  push:
    branches: [ main, agd-gemm-lean-stack ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f CONSTITUTION.md
          test -f SPECIFICATIONS.md
          test -f publisher/gate.py
          test -f evidence/schema/certificate.schema.json
          test -f lean4/PCSSCertificate.lean
          test -f lean4/lakefile.lean
          test -f lean4/SpeedupLean.lean
          test -f scripts/verify_lean4_all.sh

      - name: Validate Python gate syntax
        run: python3 -m py_compile publisher/gate.py scripts/evidence_to_lean.py

      - name: Validate certificate gate is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pcss-certificate.json <<'JSON'
          {
            "run_id": "ci-structural-check",
            "scenario_hash": "ci",
            "source_hash": "ci",
            "gates": {
              "integrity": true,
              "reproducibility": true,
              "quotient_forward": true,
              "reconstruction_reverse": true,
              "invariants": true,
              "performance": true,
              "lean": false
            }
          }
          JSON
          if python3 publisher/gate.py /tmp/pcss-certificate.json; then
            echo "Gate unexpectedly passed with lean=false"
            exit 1
          fi
          echo "Fail-closed certificate behavior confirmed"

      - name: Install Lean4 through elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.29.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build declared Lean4 package
        working-directory: lean4
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version
          lake build 2>&1 | tee /tmp/lake-build.log
          if grep -q "Build completed successfully (0 jobs)" /tmp/lake-build.log; then
            echo "Lake built 0 jobs — declared package target is not wired."
            exit 1
          fi

      - name: Verify every Lean4 source regardless of folder
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_lean4_all.sh lean4

      - name: Export Lean proof identities
        shell: bash
        run: |
          set -euo pipefail
          find lean4 -type f -name '*.lean' -print0 | sort -z | xargs -0 sha256sum | tee lean4-proof-identities.sha256
