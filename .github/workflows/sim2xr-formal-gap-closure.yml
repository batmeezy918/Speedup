name: SIM2XR Formal-Gap Closure

on:
  push:
    branches: [formal-gap-closure-20261003]
  pull_request:
    branches: [main]

jobs:
  close-formal-gap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify evidence-derived closure
        run: python3 governor/close_sim2xr_formal_gap.py
      - name: Install Lean toolchain
        uses: leanprover/lean-action@main
        with:
          lake-package-directory: lean4
          build: false
          test: false
          use-github-cache: true
      - name: Kernel-check original SIM2XR proof
        working-directory: lean4
        run: lake env lean PCSS_SIM2XR_20260908.lean
      - name: Kernel-check generated evidence binding
        working-directory: lean4
        run: lake env lean PCSS_SIM2XR_FORMAL_BINDING_GENERATED.lean
      - name: Require clean formal source
        run: |
          if grep -RniE '(^|[[:space:]])(sorry|admit)([[:space:]]|$)' lean4/PCSS_SIM2XR_20260908.lean; then
            echo "FAIL: forbidden proof hole"
            exit 1
          fi
      - name: Upload binding manifest
        uses: actions/upload-artifact@v4
        with:
          name: sim2xr-formal-binding-${{ github.sha }}
          path: |
            lean4/PCSS_SIM2XR_FORMAL_BINDING_GENERATED.lean
            verified/sim2xr/2026-09-08/bidirectional_witness.json
            verified/sim2xr/2026-09-08/CLAIM.md
